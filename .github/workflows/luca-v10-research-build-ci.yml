name: LUCA V10 Offline Research Build CI

on:
  push:
    branches:
      - research/v10-rabbitstock-eval
    paths:
      - "research/v10_rabbitstock/**"
      - "research/v03_stage24/auto_enrich_iex.py"
      - "research/v03_stage24/test_auto_enrich_iex.py"
      - ".github/workflows/luca-v10-research-build-ci.yml"
  pull_request:
    branches:
      - research/v10-rabbitstock-eval
    paths:
      - "research/v10_rabbitstock/**"
      - "research/v03_stage24/auto_enrich_iex.py"
      - "research/v03_stage24/test_auto_enrich_iex.py"
      - ".github/workflows/luca-v10-research-build-ci.yml"

permissions:
  contents: read
  actions: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/v10_rabbitstock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all research safety tests
        run: |
          python -m unittest discover -v
          python ../v03_stage24/test_auto_enrich_iex.py
      - name: Build frozen actual-snapshot report
        run: |
          python run_research_build.py \
            --input-dir . \
            --output build_outputs/latest_research_build.json \
            --html-output build_outputs/latest_research_build.html \
            --built-at "2026-11-14T00:30:00+09:00"
      - name: Verify two-provider reference outcomes
        run: |
          python validate_frozen_signals.py validation_manifest.json \
            --output build_outputs/validation_readiness.json
      - name: Verify order safety flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build_outputs/latest_research_build.json").read_text())
          assert data["WATCH_ONLY"] is True
          assert data["NO_ORDERS"] is True
          assert data["validation_status"] == "NOT_VALIDATED"
          assert all(x["NO_ORDERS"] is True for x in data["candidates"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: luca-v10-executable-research-build
          path: |
            research/v10_rabbitstock/build_outputs/latest_research_build.json
            research/v10_rabbitstock/build_outputs/latest_research_build.html
            research/v10_rabbitstock/build_outputs/validation_readiness.json
          retention-days: 30
