name: LUCA fixed November IEX historical review
on:
  push:
    branches: ['research/v10-iex-history-20261128-once']
    paths: ['.github/workflows/luca-v10-history-20261128.yml']
permissions: {}
jobs:
  archive:
    if: github.event.before == 'db43b1fe1f4b1889b1de55c1af8a6f2265a36764' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the seven frozen historical IEX windows
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PYTHON'
          """Read-only collection of the fixed Alpaca IEX requests. No external libraries."""
          import json
          import os
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          from urllib.parse import urlencode




          class RejectRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None


          def fetch(requests, folder):
              key = os.getenv("APCA_API_KEY_ID") or os.getenv("ALPACA_API_KEY_ID")
              secret = os.getenv("APCA_API_SECRET_KEY") or os.getenv("ALPACA_API_SECRET_KEY")
              if not key or not secret:
                  raise SystemExit("현재 환경에 Alpaca 조회 인증이 없습니다.")
              folder.mkdir(exist_ok=False)
              opener = build_opener(RejectRedirect())
              index = {"source": "Alpaca IEX", "status": "INCOMPLETE", "pages": []}
              manifest = folder / "manifest.json"

              def save():
                  temp = manifest.with_suffix(".tmp")
                  temp.write_text(json.dumps(index, indent=2), encoding="utf-8")
                  temp.replace(manifest)

              save()
              try:
                  for task in requests:
                      params = dict(task["params"])
                      tokens = set()
                      for number in range(1, 101):
                          url = "https://data.alpaca.markets/v2/stocks/bars?" + urlencode(params)
                          req = Request(url, headers={"APCA-API-KEY-ID": key, "APCA-API-SECRET-KEY": secret})
                          with opener.open(req, timeout=30) as response:
                              raw = response.read()
                          name = f"{params['symbols']}_{task['date_et']}_{number}.json"
                          (folder / name).write_bytes(raw)
                          index["pages"].append(dict(file=name, url=url, received_utc=datetime.now(timezone.utc).isoformat(),
                                                     sha256=sha256(raw).hexdigest()))
                          save()
                          data = json.loads(raw)
                          if "bars" not in data or not isinstance(data["bars"], dict):
                              raise ValueError("Missing bars object")
                          if set(data["bars"]) - {params["symbols"]}:
                              raise ValueError("Unexpected symbol")
                          if not (token := data.get("next_page_token")):
                              break
                          if token in tokens:
                              raise ValueError("Repeated page token")
                          tokens.add(token)
                          params["page_token"] = token
                      else:
                          raise ValueError("Pagination incomplete")
                  index["status"] = "RESPONSES_ARCHIVED"
              except Exception as exc:
                  index["error"] = f"HTTP {exc.code}" if isinstance(exc, HTTPError) else type(exc).__name__
                  raise
              finally:
                  save()



          requests = [
              {'date_et': '2026-11-23', 'params': {'symbols': 'MUU', 'timeframe': '1Min', 'feed': 'iex', 'adjustment': 'raw', 'asof': '-', 'start': '2026-11-23T20:09:00+00:00', 'end': '2026-11-23T20:59:00+00:00', 'limit': 1000, 'sort': 'asc'}},
              {'date_et': '2026-11-20', 'params': {'symbols': 'NOK', 'timeframe': '1Min', 'feed': 'iex', 'adjustment': 'raw', 'asof': '-', 'start': '2026-11-20T19:17:00+00:00', 'end': '2026-11-20T20:29:00+00:00', 'limit': 1000, 'sort': 'asc'}},
              {'date_et': '2026-11-25', 'params': {'symbols': 'NVD', 'timeframe': '1Min', 'feed': 'iex', 'adjustment': 'raw', 'asof': '-', 'start': '2026-11-25T14:31:00+00:00', 'end': '2026-11-25T15:41:00+00:00', 'limit': 1000, 'sort': 'asc'}},
              {'date_et': '2026-11-20', 'params': {'symbols': 'NXAT', 'timeframe': '1Min', 'feed': 'iex', 'adjustment': 'raw', 'asof': '-', 'start': '2026-11-20T19:17:00+00:00', 'end': '2026-11-20T20:45:00+00:00', 'limit': 1000, 'sort': 'asc'}},
              {'date_et': '2026-11-23', 'params': {'symbols': 'PAAI', 'timeframe': '1Min', 'feed': 'iex', 'adjustment': 'raw', 'asof': '-', 'start': '2026-11-23T17:04:00+00:00', 'end': '2026-11-23T18:19:00+00:00', 'limit': 1000, 'sort': 'asc'}},
              {'date_et': '2026-11-20', 'params': {'symbols': 'VWAV', 'timeframe': '1Min', 'feed': 'iex', 'adjustment': 'raw', 'asof': '-', 'start': '2026-11-20T15:09:00+00:00', 'end': '2026-11-20T16:18:00+00:00', 'limit': 1000, 'sort': 'asc'}},
              {'date_et': '2026-11-23', 'params': {'symbols': 'WETO', 'timeframe': '1Min', 'feed': 'iex', 'adjustment': 'raw', 'asof': '-', 'start': '2026-11-23T17:07:00+00:00', 'end': '2026-11-23T18:19:00+00:00', 'limit': 1000, 'sort': 'asc'}},
          ]
          fetch(requests, Path("responses"))
          PYTHON
