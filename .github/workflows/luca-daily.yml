name: LUCA 무료 장마감 연구 (별도 사이트)
on:
  workflow_dispatch:
  schedule:
    # 한국시간 화~토 14:17, 미국 장마감 후 1회 (무료 예약은 지연/누락 가능)
    - cron: '17 5 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 공개 연구 저장소 가져오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 업로드된 원본 ZIP 검증 및 별도 폴더에 압축 해제
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          archive=pathlib.Path('LUCA_FREE_GITHUB_ZERO_COST_20261021.zip')
          expected='27acd4582b82f8cf41790600b4353693b55d9cab915cea18601fb8a900354759'
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise SystemExit('ZIP 내용이 달라졌습니다. 안전 중단')
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit('ZIP 파일 손상. 안전 중단')
              for entry in z.namelist():
                  p=pathlib.PurePosixPath(entry)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('안전하지 않은 ZIP 경로: '+entry)
              z.extractall('_luca_private')
          pathlib.Path('_luca_private/docs').mkdir(exist_ok=True)
          if pathlib.Path('status.json').exists():
              pathlib.Path('_luca_private/docs/status.json').write_bytes(pathlib.Path('status.json').read_bytes())
          if pathlib.Path('latest.html').exists():
              pathlib.Path('_luca_private/docs/latest.html').write_bytes(pathlib.Path('latest.html').read_bytes())
          print('실행 파일 준비 성공 · 실제 매수 불가')
          PY
      - name: 실제 무료 일봉 관찰 수집 1회 시도
        id: scan
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd _luca_private
          python run_free_cloud.py once > ../luca-run.log 2>&1
      - name: 왜 실패했는지 간단 진단 기록
        if: always()
        run: |
          python - <<'PYDIAG'
          import collections, json, pathlib, re
          root=pathlib.Path('_luca_private/engine/local-data/standalone-workspaces')
          paths=sorted(root.glob('luca-*'),key=lambda p:p.stat().st_mtime) if root.is_dir() else []
          report=['LUCA 무료 장마감 연구판 / 진단 전용 / 매수 차단 / NOT_VALIDATED']
          def load(p):
              try:return json.loads(p.read_text(encoding='utf-8'))
              except (ValueError,OSError):return {}
          def clean(value):
              v=str(value)[:350]
              v=re.sub(r'https?://[^\s]+','[URL 비공개]',v)
              v=re.sub(r'(?:sk-[A-Za-z0-9_-]{10,}|gh[pousr]_[A-Za-z0-9_]+)','[토큰 비공개]',v)
              return v.replace('\n',' ')
          if not paths:
              report.append('연구 실행 폴더가 생성되지 않았습니다.')
          else:
              home=paths[-1]
              state=load(home/'state.json'); last=state.get('last_attempt',{})
              supervisor=load(home/'supervisor-result.json')
              report += [
                '수집 최종 상태: '+clean(last.get('status','없음')),
                '수집 직접 오류 종류: '+clean(last.get('error_type','없음')),
                '수집 직접 오류: '+clean(last.get('reason','상세 실패 사유 없음')),
                '관측 HTTP 403 횟수: '+clean(last.get('http_403_count','미확인')),
                '네트워크 오류 수: '+clean(last.get('network_error_count','미확인')),
                '시도한 종목 자료 수: '+clean(last.get('attempted','미확인')),
                '선정된 라이트 대상 수: '+clean(last.get('selected_for_light','미확인')),
                '감독기 종료 상태: '+clean(supervisor.get('status','없음')),
                '감독기 자식 종료코드: '+clean(supervisor.get('exit_code','미확인')),
              ]
              attempts=sorted((home/'attempts').glob('*')) if (home/'attempts').exists() else []
              if attempts:
                  a=attempts[-1]
                  journal=a/'network-events.jsonl'
                  if journal.is_file():
                      counts=collections.Counter(); codes=collections.Counter()
                      for ln in journal.read_text(encoding='utf-8',errors='replace').splitlines():
                          try:
                              e=json.loads(ln);counts[str(e.get('event'))]+=1
                              if e.get('status') is not None:codes[str(e['status'])]+=1
                          except ValueError:counts['INVALID_JSON']+=1
                      report.append('요청 이벤트: '+clean(dict(counts)))
                      report.append('HTTP 응답 코드: '+clean(dict(codes)))
                  stage=a/'stages.jsonl'
                  if stage.is_file():
                      events=[]
                      for ln in stage.read_text(encoding='utf-8',errors='replace').splitlines():
                          try:events.append(json.loads(ln).get('stage','?'))
                          except ValueError:events.append('INVALID_STAGE')
                      report.append('진행 단계: '+clean(events))
                  integrity=load(a/'network-integrity.json')
                  if integrity:report.append('요청 원본 무결성: '+clean(integrity.get('ok','미확인')))
              for n in ['supervisor.log']:
                  lp=home/n
                  if lp.is_file():
                      lines=lp.read_text(encoding='utf-8',errors='replace').splitlines()
                      report.append('감독기 로그 마지막 3줄: '+clean(' | '.join(lines[-3:])))
          pathlib.Path('luca-diagnostic.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('\n'.join(report))
          PYDIAG
      - name: 성공/실패 상태를 아이폰 사이트에 반영
        if: always()
        shell: bash
        run: |
          if [ -f _luca_private/docs/status.json ]; then
            cp _luca_private/docs/status.json status.json
            git add status.json
          fi
          if [ -f _luca_private/docs/latest.html ]; then
            cp _luca_private/docs/latest.html latest.html
            git add latest.html
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m '루카 무료 별도 연구판 관찰 상태 갱신'
            git push
          fi
      - name: GitHub Pages 준비
        if: always()
        uses: actions/configure-pages@v5
      - name: 아이폰 사이트 업로드
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _luca_private/docs
      - name: 아이폰 사이트 배포
        if: always()
        uses: actions/deploy-pages@v4
      - name: 실행 기록 보존 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luca-last-run-log
          path: |
            luca-run.log
            luca-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: 실제 수집 실패는 성공으로 처리하지 않음
        if: steps.scan.outcome != 'success'
        run: |
          echo '시장 조사 미완료 · 매수 금지 · NOT_VALIDATED'
          exit 1
