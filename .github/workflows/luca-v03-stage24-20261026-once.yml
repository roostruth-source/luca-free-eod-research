# Read-only, one-time Stage 24 frozen-protocol collection.
# No schedule, no orders, no changes to main, deployment or 5-day study.
name: LUCA V03 stage24 frozen 2026-10-26 SIP collection
on:
  push:
    branches:
      - research/v03-stage24-evidence
    paths:
      - '.github/workflows/luca-v03-stage24-20261026-once.yml'

permissions:
  contents: read

jobs:
  collect-20261026:
    if: github.ref == 'refs/heads/research/v03-stage24-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read separate research branch
        uses: actions/checkout@v4
      - name: Fetch 2026-10-26 1-minute SIP bars using frozen stage24 code (GET only)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_API_SECRET_KEY }}
          LUCA_STAGE24_DAY: '2026-10-26'
        run: python3 research/v03_stage24/locked_collector.py
      - name: Archive read-only results for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luca-v03-stage24-20261026-${{ github.run_id }}
          path: luca_stage24_new_evidence/
          if-no-files-found: ignore
          retention-days: 7
